<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Website</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
}

/* HERO */
.hero {
    background: #333;
    color: white;
    text-align: center;
    padding: 80px 20px;
}

/* TESTIMONIALS */
.testimonials {
    padding: 40px 20px;
    text-align: center;
    background: #f4f4f4;
}

.testimonial {
    margin: 10px auto;
    max-width: 500px;
    background: white;
    padding: 15px;
    border-radius: 8px;
}

/* CONTACT */
.contact {
    padding: 40px 20px;
    text-align: center;
}

input, textarea {
    width: 90%;
    max-width: 400px;
    padding: 10px;
    margin: 5px 0;
}

button {
    padding: 10px 20px;
    background: black;
    color: white;
    border: none;
    cursor: pointer;
}
</style>

</head>
<body>

<!-- HERO SECTION -->
<section class="hero">
    <h1>Welcome to My Website</h1>
    <p>Simple, clean, and modern design</p>
</section>

<!-- TESTIMONIALS -->
<section class="testimonials">
    <h2>Testimonials</h2>
    
    <div class="testimonial">"Great service!" - John</div>
    <div class="testimonial">"Amazing experience!" - Sarah</div>
    <div class="testimonial">"Highly recommend!" - Mike</div>
</section>

<!-- CONTACT FORM -->
<section class="contact">
    <h2>Contact Us</h2>

    <form>
        <input type="text" placeholder="Name"><br>
        <input type="email" placeholder="Email"><br>
        <textarea placeholder="Message"></textarea><br>
        <button type="submit">Send</button>
    </form>
</section>

</body>
</html>
